[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dolphin-mcp-pilot"
version = "0.3.0"
description = "A production-ready MCP server for Apache DolphinScheduler with 58 tools, multi-tenant auth, schedules, DAG creation, guided troubleshooting and raw API passthrough."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "dolphin-mcp-pilot contributors" }
]
keywords = ["mcp", "model-context-protocol", "dolphinscheduler", "workflow", "scheduler", "ai-agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Distributed Computing",
]
dependencies = [
  "mcp>=1.0.0,<3.0.0",
  "anyio>=4.0.0",
  "uvicorn>=0.30.0",
  "starlette>=0.37.0",
]

[project.urls]
Homepage = "https://github.com/iflytek/dolphin-mcp-pilot"
Repository = "https://github.com/iflytek/dolphin-mcp-pilot"
Issues = "https://github.com/iflytek/dolphin-mcp-pilot/issues"

[project.scripts]
dolphin-mcp-pilot = "dolphin_mcp_pilot.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["dolphin_mcp_pilot*"]

[tool.pytest.ini_options]
filterwarnings = []
