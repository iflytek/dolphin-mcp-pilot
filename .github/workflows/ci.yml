name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: pytest tests/ --ignore=tests/e2e -v

  lint:
    name: Lint and format check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.6.9

      - name: Ruff check
        run: ruff check dolphin_mcp_pilot tests

      - name: Ruff format check
        run: ruff format --check dolphin_mcp_pilot tests

  security:
    name: Security and secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          pip install bandit==1.7.9 pip-audit==2.7.3

      - name: Static security scan (bandit)
        run: bandit -r dolphin_mcp_pilot -ll

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt --strict || echo "::warning::pip-audit skipped (known issue on Windows with non-ASCII username)"

      - name: Hardcoded secret scan
        run: |
          set -e
          echo "Scanning for hardcoded credentials, internal hosts and tokens..."
          if grep -rInE '(10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3})|(password\s*=\s*["'"'"'][^"'"'"']+)|(access_token=)' \
              --include='*.py' --include='*.sh' --include='*.yml' --include='*.yaml' --include='*.json' \
              --exclude-dir='e2e' \
              dolphin_mcp_pilot tests scripts examples; then
            echo "::error::Potential hardcoded secret or internal address detected"
            exit 1
          fi
          echo "No hardcoded secrets found."

  notices:
    name: NOTICE and THIRD_PARTY_LICENSES validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate compliance files
        run: python3 scripts/validate_notices.py

  protocol-compatibility:
    name: MCP client ${{ matrix.mcp-client }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcp-client: ["1.29.0", "2.0.0"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install MCP 2.0 server
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Start stateless HTTP server
        run: |
          DS_MCP_TRANSPORT=http MCP_HOST=127.0.0.1 MCP_PORT=18001 \
            python -m dolphin_mcp_pilot >/tmp/dolphin-mcp-pilot.log 2>&1 &
          echo $! > /tmp/dolphin-mcp-pilot.pid
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          for _ in range(60):
              try:
                  urllib.request.urlopen("http://127.0.0.1:18001/mcp/", timeout=1)
              except urllib.error.HTTPError:
                  break
              except OSError:
                  time.sleep(0.5)
              else:
                  break
          else:
              raise SystemExit("MCP server did not start")
          PY

      - name: Install MCP client ${{ matrix.mcp-client }}
        run: |
          python -m venv .client-venv
          .client-venv/bin/python -m pip install "mcp==${{ matrix.mcp-client }}"

      - name: Exercise tools/list
        run: .client-venv/bin/python tests/protocol_compatibility.py

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/dolphin-mcp-pilot.log

      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/dolphin-mcp-pilot.pid)" || true

  build:
    name: Package build
    runs-on: ubuntu-latest
    needs: [test, lint, security, notices, protocol-compatibility]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify import from wheel
        run: |
          pip install dist/*.whl
          python -W ignore -c "import dolphin_mcp_pilot as m; print('version:', m.__version__)"
